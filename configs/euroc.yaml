# EuRoC MAV VI-sensor (MT9V034 stereo + ADIS16448 IMU).
# Values copied from the dataset's sensor.yaml files. scripts/run_euroc.py reads the
# calibration from the sequence folder itself; this file documents the format and
# supplies filter / front-end tuning.
cameras:
  - name: cam0
    distortion_model: radtan
    intrinsics: [458.654, 457.296, 367.215, 248.375]
    distortion: [-0.28340811, 0.07395907, 0.00019359, 1.76187114e-05]
    resolution: [752, 480]
    T_imu_cam:   # camera -> IMU/body (EuRoC T_BS)
      - [0.0148655429818, -0.999880929698, 0.00414029679422, -0.0216401454975]
      - [0.999557249008, 0.0149672133247, 0.025715529948, -0.064676986768]
      - [-0.0257744366974, 0.00375618835797, 0.999660727178, 0.00981073058949]
      - [0.0, 0.0, 0.0, 1.0]
  - name: cam1
    distortion_model: radtan
    intrinsics: [457.587, 456.134, 379.999, 255.238]
    distortion: [-0.28368365, 0.07451284, -0.00010473, -3.55590700e-05]
    resolution: [752, 480]
    T_imu_cam:
      - [0.0125552670891, -0.999755099723, 0.0182237714554, -0.0198435579556]
      - [0.999598781151, 0.0130119051815, 0.0251588363115, 0.0453689425024]
      - [-0.0253898008918, 0.0179005838253, 0.999517347078, 0.00786212447038]
      - [0.0, 0.0, 0.0, 1.0]
imu:
  rate_hz: 200
  gyro_noise: 1.6968e-04     # rad/s/sqrt(Hz)
  accel_noise: 2.0e-03       # m/s^2/sqrt(Hz)
  gyro_walk: 1.9393e-05      # rad/s^2/sqrt(Hz)
  accel_walk: 3.0e-03        # m/s^3/sqrt(Hz)
time_offset: 0.0             # t_imu = t_cam + time_offset  (EuRoC is hardware-synced)
filter:
  max_clones: 11
  pixel_sigma: 1.5           # px
  chi2_prob: 0.95
frontend:
  max_features: 150
  fast_threshold: 15
  min_distance: 15
  pyramid_levels: 4
  win: 15
